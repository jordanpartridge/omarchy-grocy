name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QML tools
        run: >
          sudo apt-get update && sudo apt-get install -y
          g++ pkg-config
          qt6-base-dev qt6-declarative-dev
          qt6-declarative-dev-tools
          qml6-module-qtquick qml6-module-qtqml

      - name: Lint
        run: python -m pip install ruff && ruff check .

      - name: Validate manifest
        run: python3 scripts/check_manifest.py

      - name: Scrub check
        run: python3 scripts/scrub_check.py

      - name: Test
        run: QT_QPA_PLATFORM=offscreen python3 tests/test_grocy.py

      - name: Install gitleaks
        run: |
          version=8.28.0
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Secret scan
        run: gitleaks detect --source . --redact --no-banner --verbose
